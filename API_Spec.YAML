components:
  schemas:
    Contact:
      type: object
      description: |-
        Contact 모델을 위한 Serializer
        - 목록 조회, 생성, 수정에 사용됩니다.
      properties:
        id:
          type: integer
          readOnly: true
        address:
          type: string
          maxLength: 255
      required:
      - address
      - id
    EmailAccount:
      type: object
      description: EmailAccount 모델의 목록 조회를 위한 Serializer
      properties:
        id:
          type: integer
          readOnly: true
        address:
          type: string
          format: email
          maxLength: 254
        domain:
          type: string
          maxLength: 255
        is_valid:
          type: boolean
        last_synced:
          type: string
          format: date-time
          nullable: true
        job:
          type: string
          nullable: true
          description: 사용자의 직업
          maxLength: 100
        usage:
          type: string
          nullable: true
          description: '계정의 용도 (예: 개인용, 업무용)'
          maxLength: 100
        interests:
          nullable: true
          description: '사용자 관심사 목록 (예: [''기술'', ''스포츠''])'
      required:
      - address
      - domain
      - id
    EmailAccountCreate:
      type: object
      description: EmailAccount 생성을 위한 Serializer
      properties:
        address:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
      required:
      - address
      - password
    EmailAccountInfo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        address:
          type: string
          format: email
          maxLength: 254
      required:
      - address
      - id
    EmailAccountProfile:
      type: object
      description: EmailAccount 프로필 수정을 위한 Serializer
      properties:
        job:
          type: string
          nullable: true
          description: 사용자의 직업
          maxLength: 100
        usage:
          type: string
          nullable: true
          description: '계정의 용도 (예: 개인용, 업무용)'
          maxLength: 100
        interests:
          nullable: true
          description: '사용자 관심사 목록 (예: [''기술'', ''스포츠''])'
    EmailContent:
      type: object
      properties:
        subject:
          type: string
          nullable: true
          maxLength: 255
        from_header:
          type: string
          nullable: true
        to_header:
          nullable: true
        cc_header:
          nullable: true
        bcc_header:
          nullable: true
        text_body:
          type: string
          nullable: true
        html_body:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
          nullable: true
    EmailDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        account_address:
          type: string
          readOnly: true
        folder:
          allOf:
          - $ref: '#/components/schemas/FolderEnum'
          description: |-
            폴더 지정: inbox(받은 편지함), sent(보낸 편지함), spam(스팸 메일함), starred(별표 편지함), trash(휴지통)

            * `inbox` - 받은 편지함
            * `sent` - 보낸 편지함
            * `spam` - 스팸 편지함
            * `starred` - 별표 편지함
            * `trash` - 휴지통
        is_read:
          type: boolean
          description: 읽음 상태 여부
        is_important:
          type: boolean
          description: 중요 메일 표시 여부
        is_pinned:
          type: boolean
          description: 상단 고정 여부
        received_at:
          type: string
          format: date-time
        email:
          allOf:
          - $ref: '#/components/schemas/EmailContent'
          readOnly: true
      required:
      - account_address
      - email
      - id
      - received_at
    EmailMetadataList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        account_address:
          type: string
          readOnly: true
        folder:
          allOf:
          - $ref: '#/components/schemas/FolderEnum'
          description: |-
            폴더 지정: inbox(받은 편지함), sent(보낸 편지함), spam(스팸 메일함), starred(별표 편지함), trash(휴지통)

            * `inbox` - 받은 편지함
            * `sent` - 보낸 편지함
            * `spam` - 스팸 편지함
            * `starred` - 별표 편지함
            * `trash` - 휴지통
        is_read:
          type: boolean
          description: 읽음 상태 여부
        is_important:
          type: boolean
          description: 중요 메일 표시 여부
        is_pinned:
          type: boolean
          description: 상단 고정 여부
        received_at:
          type: string
          format: date-time
        email:
          allOf:
          - $ref: '#/components/schemas/EmailPreview'
          readOnly: true
      required:
      - account_address
      - email
      - id
      - received_at
    EmailPreview:
      type: object
      properties:
        subject:
          type: string
          description: RFC 2047 형식으로 인코딩된 이메일 제목을 디코딩하여 반환합니다.
          readOnly: true
        from_header:
          type: string
          nullable: true
        to_header:
          nullable: true
        date:
          type: string
          format: date-time
          nullable: true
        preview:
          type: string
          description: |-
            본문 내용의 미리보기를 생성합니다.
            text_body가 있으면 사용하고, 없으면 html_body에서 불필요한 부분을 제거하여 사용합니다.
          readOnly: true
      required:
      - preview
      - subject
    EmailSend:
      type: object
      description: 이메일 전송 API의 요청 본문(Request Body) 유효성 검사를 위한 Serializer
      properties:
        account_id:
          type: integer
          description: 메일을 보낼 EmailAccount의 ID
        to:
          type: array
          items:
            type: string
            format: email
          description: 수신자 이메일 주소 리스트
        cc:
          type: array
          items:
            type: string
            format: email
          description: 참조 이메일 주소 리스트
        bcc:
          type: array
          items:
            type: string
            format: email
          description: 숨은 참조 이메일 주소 리스트
        subject:
          type: string
          description: 메일 제목
          maxLength: 255
        body:
          type: string
          description: 메일 본문
        is_html:
          type: boolean
          default: false
          description: 메일 본문이 HTML 형식인지 여부
      required:
      - account_id
      - body
      - subject
      - to
    EmailSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        summarized_content:
          type: string
          readOnly: true
          nullable: true
        is_summarized:
          type: boolean
          readOnly: true
          description: 요약 여부
      required:
      - id
      - is_summarized
      - summarized_content
    FolderEnum:
      enum:
      - inbox
      - sent
      - spam
      - starred
      - trash
      type: string
      description: |-
        * `inbox` - 받은 편지함
        * `sent` - 보낸 편지함
        * `spam` - 스팸 편지함
        * `starred` - 별표 편지함
        * `trash` - 휴지통
    MyTemplate:
      type: object
      description: Template model serializer
      properties:
        id:
          type: integer
          readOnly: true
        main_category:
          type: string
          nullable: true
          maxLength: 100
        sub_category:
          type: string
          nullable: true
          maxLength: 100
        topic:
          type: string
          nullable: true
          maxLength: 100
        template_title:
          type: string
          nullable: true
          maxLength: 255
        template_content:
          type: string
          nullable: true
          maxLength: 1000
        email_account:
          $ref: '#/components/schemas/EmailAccountInfo'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email_account
      - id
    MyTemplateCreateRequest:
      type: object
      properties:
        template_content:
          type: string
          nullable: true
          maxLength: 1000
        template_title:
          type: string
          nullable: true
          maxLength: 255
        sub_category:
          type: string
          nullable: true
          maxLength: 100
        topic:
          type: string
          nullable: true
          maxLength: 100
    MyTemplateUpdateRequest:
      type: object
      properties:
        sub_category:
          type: string
          nullable: true
          maxLength: 100
        topic:
          type: string
          nullable: true
          maxLength: 100
        template_title:
          type: string
          nullable: true
          maxLength: 255
        template_content:
          type: string
          nullable: true
          maxLength: 1000
    PatchedContact:
      type: object
      description: |-
        Contact 모델을 위한 Serializer
        - 목록 조회, 생성, 수정에 사용됩니다.
      properties:
        id:
          type: integer
          readOnly: true
        address:
          type: string
          maxLength: 255
    PatchedEmailAccountProfile:
      type: object
      description: EmailAccount 프로필 수정을 위한 Serializer
      properties:
        job:
          type: string
          nullable: true
          description: 사용자의 직업
          maxLength: 100
        usage:
          type: string
          nullable: true
          description: '계정의 용도 (예: 개인용, 업무용)'
          maxLength: 100
        interests:
          nullable: true
          description: '사용자 관심사 목록 (예: [''기술'', ''스포츠''])'
    PatchedEmailUpdate:
      type: object
      properties:
        folder:
          allOf:
          - $ref: '#/components/schemas/FolderEnum'
          description: |-
            폴더 지정: inbox(받은 편지함), sent(보낸 편지함), spam(스팸 메일함), starred(별표 편지함), trash(휴지통)

            * `inbox` - 받은 편지함
            * `sent` - 보낸 편지함
            * `spam` - 스팸 편지함
            * `starred` - 별표 편지함
            * `trash` - 휴지통
        is_read:
          type: boolean
          description: 읽음 상태 여부
        is_important:
          type: boolean
          description: 중요 메일 표시 여부
        is_pinned:
          type: boolean
          description: 상단 고정 여부
    ViewTemplate:
      type: object
      description: Template model serializer for viewing templates
      properties:
        id:
          type: integer
          readOnly: true
        main_category:
          type: string
          nullable: true
          maxLength: 100
        sub_category:
          type: string
          nullable: true
          maxLength: 100
        topic:
          type: string
          nullable: true
          maxLength: 100
        template_title:
          type: string
          nullable: true
          maxLength: 255
        template_content:
          type: string
          nullable: true
          maxLength: 1000
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk JWT 토큰을 사용한 인증. Authorization 헤더에 'Bearer <token>' 형식으로 전달합니다.
