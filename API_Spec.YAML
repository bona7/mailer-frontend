        '200':
          content:
            application/json:
              schema:
                description: 이메일이 성공적으로 전송되었습니다.
                example:
                  message: 이메일이 성공적으로 전송되었습니다.
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: 잘못된 요청 데이터
