openapi: 3.0.3
info:
  title: Mailer API
  version: 1.0.0
  description: Mailer project
paths:
  /api/account/:
    get:
      operationId: account_list
      description: 현재 로그인된 사용자가 연동한 모든 이메일 계정 목록을 조회합니다.
      summary: 연동된 메일 계정 목록 조회
      tags:
      - account
      security:
      - clerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailAccount'
              examples:
                조회성공:
                  value:
                  - - id: 1
                      address: user1@example.com
                      domain: example.com
                      is_valid: true
                      last_synced: '2025-10-28T10:00:00Z'
                  summary: 조회 성공
          description: ''
    post:
      operationId: account_create
      description: 새로운 이메일 계정을 연동합니다. 비밀번호는 암호화되어 저장됩니다.
      summary: 메일 계정 연동
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailAccountCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailAccountCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailAccountCreate'
        required: true
      security:
      - clerkAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAccount'
              examples:
                생성성공:
                  value:
                    id: 2
                    address: new_user@gmail.com
                    domain: gmail
                    is_valid: true
                    last_synced: null
                  summary: 생성 성공
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                유효성검사실패:
                  value:
                    address:
                    - Enter a valid email address.
                  summary: 유효성 검사 실패
                이미등록된계정:
                  value:
                    detail: This email account is already registered.
                  summary: 이미 등록된 계정
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/account/{account_id}/:
    delete:
      operationId: account_destroy
      description: 지정된 ID의 이메일 계정 연동을 삭제합니다.
      summary: 연동된 메일 계정 삭제
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - account
      security:
      - clerkAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                찾을수없음/권한없음:
                  value:
                    detail: Not found.
                  summary: 찾을 수 없음 / 권한 없음
          description: ''
  /api/account/{account_id}/profile/:
    patch:
      operationId: account_profile_partial_update
      description: 지정된 이메일 계정의 프로필을 설정하거나 수정합니다. `PATCH` 메서드이므로, **변경하려는 필드만** 요청
        바디에 담아 보낼 수 있습니다. 해당 프로필은 이후 스팸 필터링에 사용됩니다.
      summary: 메일 계정 프로필 설정/수정
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmailAccountProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmailAccountProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmailAccountProfile'
      security:
      - clerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAccountProfile'
              examples:
                수정성공:
                  value:
                    job: 데이터 분석가
                    usage: 학교용
                    interests:
                    - 금융
                    - 부동산
                  summary: 수정 성공
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                유효성검사실패:
                  value:
                    interests:
                    - This field must be a list.
                  summary: 유효성 검사 실패
          description: ''
  /api/account/{id}/sync/:
    post:
      operationId: account_sync_create
      description: 특정 이메일 계정의 메일을 수동으로 동기화합니다.
      summary: 이메일 수동 동기화
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - account
      security:
      - clerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                동기화성공:
                  value:
                    message: user@example.com의 동기화가 완료되었습니다.
                  summary: 동기화 성공
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                계정없음:
                  value:
                    error: 계정을 찾을 수 없거나 권한이 없습니다.
                  summary: 계정 없음
          description: ''
        '500':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                IMAP동기화실패:
                  value:
                    error: 'IMAP 동기화 실패: [Errno 111] Connection refused'
                  summary: IMAP 동기화 실패
          description: ''
  /api/contact/{account_id}/:
    get:
      operationId: contact_list
      description: 특정 이메일 계정(`account_id`)에 등록된 즐겨찾기 주소 목록을 조회합니다.
      summary: 즐겨찾기 주소록 목록 조회
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - contact
      security:
      - clerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
              examples:
                조회성공:
                  value:
                  - - id: 1
                      address: friend@example.com
                  summary: 조회 성공
          description: ''
    post:
      operationId: contact_create
      description: 특정 이메일 계정(`account_id`)에 새로운 주소를 즐겨찾기로 추가합니다.
      summary: 즐겨찾기 주소 추가
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - contact
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Contact'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Contact'
        required: true
      security:
      - clerkAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
              examples:
                추가성공:
                  value:
                    id: 3
                    address: new_friend@example.com
                  summary: 추가 성공
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                중복추가시도:
                  value:
                    detail: This address is already in the contact list.
                  summary: 중복 추가 시도
          description: ''
  /api/contact/{contact_id}/:
    patch:
      operationId: contact_partial_update
      description: 특정 연락처(`contact_id`)의 주소를 수정합니다.
      summary: 즐겨찾기 주소 수정
      parameters:
      - in: path
        name: contact_id
        schema:
          type: integer
        required: true
      tags:
      - contact
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedContact'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedContact'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedContact'
      security:
      - clerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
              examples:
                수정성공:
                  value:
                    id: 3
                    address: re_friend@example.com
                  summary: 수정 성공
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: contact_destroy
      description: 특정 연락처(`contact_id`)를 즐겨찾기에서 삭제합니다.
      summary: 즐겨찾기 주소 삭제
      parameters:
      - in: path
        name: contact_id
        schema:
          type: integer
        required: true
      tags:
      - contact
      security:
      - clerkAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/email/:
    get:
      operationId: email_list
      description: |2-

                메일 통합 조회를 위핸 API View입니다. 해당 API로 가능한 것:
                1. 이메일 계정 별 이메일 조회. (생략 시 전체 조회)
                2. 폴더 별 이메일 조회. 받은(inbox), 보낸(sent), 별표(starred), 스팸(spam), 휴지통(trash). (생략 시 전체 폴더)
                3. 검색어로 이메일 필터링. (제목, 보낸사람, 내용, 수신자 대상)
      summary: 메일 통합 조회
      parameters:
      - in: query
        name: accounts
        schema:
          type: string
        description: 콤마(,)로 구분된 이메일 주소 목록으로 필터링합니다. 생략 시 모든 계정을 포함합니다.
      - in: query
        name: folder
        schema:
          type: string
          enum:
          - inbox
          - sent
          - spam
          - starred
          - trash
        description: 폴더 이름으로 필터링합니다.
      - in: query
        name: query
        schema:
          type: string
        description: 검색어로 필터링합니다. 보낸사람, 제목, 내용, 수신자 필드를 대상으로 검색합니다.
      - in: query
        name: user_id
        schema:
          type: integer
        description: (임시 테스트용) 로그인 기능 구현 전, 테스트할 사용자의 ID를 직접 입력합니다.
      tags:
      - email
      security:
      - clerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailMetadataList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/email/{id}/:
    get:
      operationId: email_retrieve
      description: "개별 이메일에 대한 거의 모든 작업을 할 수 있습니다.\n특정 ID를 가진 이메일 하나에 대한 작업을 수행합니다.\n1.
        GET: 이메일의 상세 정보를 조회합니다. (조회 시 자동으로 '읽음' 상태로 변경됨.)\n2. PATCH: 이메일의 상태(폴더 바꾸기(inbox,
        sent, starred, spam, trash, 읽음 여부 설정 등)를 부분적으로 수정합니다.\n3. DELETE:\n    - 휴지통에
        있지 않은 경우: 휴지통으로 이동시키고, 수정된 이메일 정보를 반환합니다. (상태 코드 200)\n    - 휴지통에 있는 경우: 영구
        삭제(소프트 딜리트)하고, 내용 없는 응답을 반환합니다. (상태 코드 204)\n    "
      summary: 개별 이메일의 조회, 설정, 삭제
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - email
      security:
      - clerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDetail'
          description: ''
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: email_partial_update
      description: "개별 이메일에 대한 거의 모든 작업을 할 수 있습니다.\n특정 ID를 가진 이메일 하나에 대한 작업을 수행합니다.\n1.
        GET: 이메일의 상세 정보를 조회합니다. (조회 시 자동으로 '읽음' 상태로 변경됨.)\n2. PATCH: 이메일의 상태(폴더 바꾸기(inbox,
        sent, starred, spam, trash, 읽음 여부 설정 등)를 부분적으로 수정합니다.\n3. DELETE:\n    - 휴지통에
        있지 않은 경우: 휴지통으로 이동시키고, 수정된 이메일 정보를 반환합니다. (상태 코드 200)\n    - 휴지통에 있는 경우: 영구
        삭제(소프트 딜리트)하고, 내용 없는 응답을 반환합니다. (상태 코드 204)\n    "
      summary: 개별 이메일의 조회, 설정, 삭제
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - email
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmailUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmailUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmailUpdate'
      security:
      - clerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDetail'
          description: ''
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: email_destroy
      description: "개별 이메일에 대한 거의 모든 작업을 할 수 있습니다.\n특정 ID를 가진 이메일 하나에 대한 작업을 수행합니다.\n1.
        GET: 이메일의 상세 정보를 조회합니다. (조회 시 자동으로 '읽음' 상태로 변경됨.)\n2. PATCH: 이메일의 상태(폴더 바꾸기(inbox,
        sent, starred, spam, trash, 읽음 여부 설정 등)를 부분적으로 수정합니다.\n3. DELETE:\n    - 휴지통에
        있지 않은 경우: 휴지통으로 이동시키고, 수정된 이메일 정보를 반환합니다. (상태 코드 200)\n    - 휴지통에 있는 경우: 영구
        삭제(소프트 딜리트)하고, 내용 없는 응답을 반환합니다. (상태 코드 204)\n    "
      summary: 개별 이메일의 조회, 설정, 삭제
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - email
      security:
      - clerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailDetail'
          description: ''
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/email/{id}/resummarize/:
    post:
      operationId: email_resummarize_create
      description: |-
        특정 메일(`email_metadata_id`)의 요약을 LLM에 요청하고 결과를 받아 DB에 저장한 후, 프론트엔드로 리턴합니다.
                기본적으로 `is_summarized` 필드를 확인하여, `False`일 경우에만 LLM을 호출합니다. `True`라면 DB에 저장된 기존 요약본을 즉시 반환합니다.
                `/resummarize/` 엔드포인트로 요청 시, `is_summarized` 필드와 관계없이 항상 LLM을 새로 호출하여 기존 `summarized_content`를 덮어씁니다.
      summary: 메일 요약 요청 / 재생성 요청
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - email
      security:
      - clerkAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSummary'
              examples:
                요약성공(기존또는신규):
                  value:
                    id: 123
                    summarized_content: 이것은 LLM이 요약한 내용입니다...
                    is_summarized: true
                  summary: 요약 성공 (기존 또는 신규)
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                LLM서비스오류:
                  value:
                    detail: The summarization service got error. try again.
                  summary: LLM 서비스 오류
          description: ''
  /api/email/{id}/summarize/:
    post:
      operationId: email_summarize_create
      description: |-
        특정 메일(`email_metadata_id`)의 요약을 LLM에 요청하고 결과를 받아 DB에 저장한 후, 프론트엔드로 리턴합니다.
                기본적으로 `is_summarized` 필드를 확인하여, `False`일 경우에만 LLM을 호출합니다. `True`라면 DB에 저장된 기존 요약본을 즉시 반환합니다.
                `/resummarize/` 엔드포인트로 요청 시, `is_summarized` 필드와 관계없이 항상 LLM을 새로 호출하여 기존 `summarized_content`를 덮어씁니다.
      summary: 메일 요약 요청 / 재생성 요청
      parameters:
      - in: path
